[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truth-engine-alpha"
version = "0.1.0"
description = "Commercial evidence-analysis engine for public claim review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
truth-engine = "truth_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
